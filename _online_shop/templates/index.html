<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Product List</h1>
    <table border="1">
        <tr></th>ID</th>Name</th><th>Price</th><th>Price</th><th>Created</th><th>Updated</th></tr>
        {% for product in poducts %}
        <tr>
            <td>{{product.id}}</td>
            <td>{{product.name}}</td>
            <td>{{product.prise}}</td>
            <td>{{product.created_at}}</td>
            <td>{{product.updated_at}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
