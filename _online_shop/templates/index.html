<!DOCTYPE html>
<html>
    <head>
        <title>My shop</title>
        <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    </head>
    <body>
        <h1>ATB</h1>
        <div class="action-bar">
            <a class="btn" href="{{ url_for('routes.products') }}">Edit Products</a>
        </div>
        <div class="products">
            {% for product in products%}
            <div class="card">
               <img src="{{ url_for('static', filename='image/' ~ product.name ~ '.png') }}"
                    alt="{{ product.name }}"
                    >

                <h2 class="product-name">{{product.name}}</h2>
                <p class="product-feature">Price: ${{'%.2f'| format(product.prise)}}</p>
                <div class="card-actions">
                    <button class="btn btn-details"
                    data-name="{{ product.name|e}}"
                    data-prise="{{ '%.2f'| format(product.prise)}}"
                    data-description="{{ product.description}}"
                    data-category="{{ product.category|e}}"
                    data-rating="{{ product.rating}}"
                    data-sale="{{ product.sale}}"
                    data-active="{{ product.is_active}}"
                    data-image="{{ url_for('static', filename='image/' ~ product.name ~ '.png') }}"
                    >Details</button>
                </div>
            </div>
            {% endfor %}
        </div>
            <div id="product-modal" class="modal" aria-hidden="true">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-name">
                <button class="modal-close" aria-label="Close">&times;</button>
                <div class="modal-body">
                    <img id="modal-image" src="" alt="Product image" 
                    onerror="this.onerror=null;this.src='{{ url_for('static', filename='image/default.png') }}'">
                    <div class="modal-content">
                        <h2 id="modal-name"></h2>
                        <p class="product-feature" id="modal-prise"></p>
                        <p id="modal-stock"></p>
                        <p id="modal-desc"></p>
                        <p id="modal-meta" class="meta"></p>
                    </div>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='modal.js') }}"></script>
</html>
